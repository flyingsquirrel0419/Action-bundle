name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
      - name: Pack and smoke-test the tarball
        run: |
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/action-bundle-*.tgz
          node --input-type=module -e "
            import { createPlan } from 'action-bundle';
            const p = createPlan({ workload: { kind: 'index', count: 50 }, shards: 2 });
            if (p.taskCount !== 50) process.exit(1);
            console.log('packed package smoke test OK');
          "

