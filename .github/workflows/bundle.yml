name: shard-and-bundle

on:
  push:
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Number of parallel shards"
        required: true
        default: "8"
        type: string
      item_count:
        description: "Total number of items to process (workload size)"
        required: true
        default: "200"
        type: string
      work_intensity:
        description: "Hash rounds per item (higher = heavier CPU per item)"
        required: true
        default: "200"
        type: string
  workflow_call:
    inputs:
      shard_count:
        description: "Number of parallel shards"
        required: false
        default: "8"
        type: string
      item_count:
        description: "Total number of items to process (workload size)"
        required: false
        default: "200"
        type: string
      work_intensity:
        description: "Hash rounds per item (higher = heavier CPU per item)"
        required: false
        default: "200"
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.matrix.outputs.shard_matrix }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      item_count: ${{ steps.matrix.outputs.item_count }}
      work_intensity: ${{ steps.matrix.outputs.work_intensity }}
    steps:
      - name: Build shard matrix
        id: matrix
        env:
          INPUT_SHARDS: ${{ inputs.shard_count || '8' }}
          INPUT_ITEMS: ${{ inputs.item_count || '200' }}
          INPUT_INTENSITY: ${{ inputs.work_intensity || '200' }}
        run: |
          set -euo pipefail
          SHARDS=$(python3 -c "print(max(1, min(32, int('${INPUT_SHARDS}'))))")
          ITEMS=$(python3 -c "print(max(1, min(100000, int('${INPUT_ITEMS}'))))")
          INTENSITY=$(python3 -c "print(max(1, min(50000, int('${INPUT_INTENSITY}'))))")
          MATRIX=$(python3 -c "import json; print(json.dumps({'shard': list(range(${SHARDS}))}))")
          echo "shard_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "shard_count=${SHARDS}" >> "$GITHUB_OUTPUT"
          echo "item_count=${ITEMS}" >> "$GITHUB_OUTPUT"
          echo "work_intensity=${INTENSITY}" >> "$GITHUB_OUTPUT"
          echo "Running with ${SHARDS} shards, ${ITEMS} items, intensity ${INTENSITY}"

  shard:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run shard ${{ matrix.shard }} workload
        run: |
          python3 tools/work.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ needs.setup.outputs.shard_count }} \
            --item-count ${{ needs.setup.outputs.item_count }} \
            --work-intensity ${{ needs.setup.outputs.work_intensity }} \
            --out-dir parts/

      - name: Upload partial result
        uses: actions/upload-artifact@v4
        with:
          name: shard-part-${{ matrix.shard }}
          path: parts/part-${{ matrix.shard }}.json
          retention-days: 7

  aggregate:
    needs: [setup, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all partial results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-part-*
          path: parts/
          merge-multiple: true

      - name: Merge into one bundle
        run: |
          python3 tools/bundle.py \
            --parts-dir parts/ \
            --shard-count ${{ needs.setup.outputs.shard_count }} \
            --item-count ${{ needs.setup.outputs.item_count }} \
            --out bundle.json

      - name: Write benchmark summary
        run: |
          {
            echo "## Shard merge result"
            echo ""
            echo "| Shard | Items processed | Compute time (s) |"
            echo "|---|---|---|"
            python3 -c "
          import json
          b = json.load(open('bundle.json'))
          for s in b['per_shard']:
              print(f\"| {s['shard']} | {s['processed']} | {s['elapsed_sec']} |\")
          print()
          total = b['total_processed']
          serial = sum(s['elapsed_sec'] for s in b['per_shard'])
          slowest = b['slowest_shard_sec']
          print(f\"Processed **{total}** items across **{b['shard_count']}** shards.\")
          print(f\"Sum of per-shard compute time (serial estimate): **{serial:.2f}s**; slowest shard (parallel wall-clock floor): **{slowest}s**; ideal speedup: **{serial / max(slowest, 1e-9):.1f}x**.\")
          "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-result
          path: bundle.json
          retention-days: 30

