name: shard-and-bundle

on:
  push:
  workflow_dispatch:
    inputs:
      shard_count:
        description: "병렬로 돌릴 샤드 개수"
        required: true
        default: "8"
        type: string
      item_count:
        description: "처리할 item 개수 (작업량)"
        required: true
        default: "200"
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.matrix.outputs.shard_matrix }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      item_count: ${{ steps.matrix.outputs.item_count }}
    steps:
      - name: 샤드 matrix 생성
        id: matrix
        env:
          INPUT_SHARDS: ${{ inputs.shard_count || '8' }}
          INPUT_ITEMS: ${{ inputs.item_count || '200' }}
        run: |
          set -euo pipefail
          SHARDS=$(python3 -c "print(max(1, min(32, int('${INPUT_SHARDS}'))))")
          ITEMS=$(python3 -c "print(max(1, min(100000, int('${INPUT_ITEMS}'))))")
          MATRIX=$(python3 -c "import json; print(json.dumps({'shard': list(range(${SHARDS}))}))")
          echo "shard_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "shard_count=${SHARDS}" >> "$GITHUB_OUTPUT"
          echo "item_count=${ITEMS}" >> "$GITHUB_OUTPUT"
          echo "샤드 ${SHARDS}개, item ${ITEMS}개로 실행"

  shard:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 샤드 ${{ matrix.shard }} 작업 실행
        run: |
          python3 tools/work.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ needs.setup.outputs.shard_count }} \
            --item-count ${{ needs.setup.outputs.item_count }} \
            --out-dir parts/

      - name: 부분 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: shard-part-${{ matrix.shard }}
          path: parts/part-${{ matrix.shard }}.json
          retention-days: 7

  aggregate:
    needs: [setup, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 모든 부분 결과 다운로드
        uses: actions/download-artifact@v4
        with:
          pattern: shard-part-*
          path: parts/
          merge-multiple: true

      - name: 하나로 병합
        run: |
          python3 tools/bundle.py \
            --parts-dir parts/ \
            --shard-count ${{ needs.setup.outputs.shard_count }} \
            --item-count ${{ needs.setup.outputs.item_count }} \
            --out bundle.json

      - name: 잡 요약 출력
        run: |
          {
            echo "## 샤드 병합 결과"
            echo ""
            echo "| 샤드 | 처리 개수 | 소요 시간(s) |"
            echo "|---|---|---|"
            python3 -c "
          import json
          b = json.load(open('bundle.json'))
          for s in b['per_shard']:
              print(f\"| {s['shard']} | {s['processed']} | {s['elapsed_sec']} |\")
          print()
          print(f\"총 {b['total_processed']}개 item을 {b['shard_count']}개 샤드로 처리했습니다.\")
          "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 최종 번들 업로드
        uses: actions/upload-artifact@v4
        with:
          name: bundle-result
          path: bundle.json
          retention-days: 30
