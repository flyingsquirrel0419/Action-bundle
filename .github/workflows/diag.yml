name: ab-diag
on:
  workflow_call:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Print reusable-workflow identity contexts
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REPOSITORY: ${{ github.workflow_repository }}
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          echo "github.repository:            $GITHUB_REPOSITORY"
          echo "github.workflow_ref:          $GITHUB_WORKFLOW_REF"
          echo "github.workflow_sha:          $GITHUB_WORKFLOW_SHA"
          echo "github.workflow_repository:   $GITHUB_WORKFLOW_REPOSITORY"
          echo "job.workflow_repository:      $JOB_WORKFLOW_REPOSITORY"
          echo "job.workflow_ref:             $JOB_WORKFLOW_REF"
          echo "job.workflow_sha:             $JOB_WORKFLOW_SHA"

