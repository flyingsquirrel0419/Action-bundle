name: 기능 제안 (Feature request)
description: 새로운 기능이나 개선을 제안한다
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하고 싶나
      description: 현재 겪는 불편이나 한계. "X를 하려는데 Y가 안 된다" 형태로
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 결과
      description: 어떻게 동작하면 좋겠는지 (구현 방법이 아니라 결과 위주로)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 지금 우회해서 쓰는 방법이 있다면

