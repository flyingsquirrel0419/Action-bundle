name: Feature request
description: Propose a new feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The friction or limitation you hit, in "I want to do X but Y blocks me" form
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired outcome
      description: How it should behave (outcome, not implementation)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds, if any

