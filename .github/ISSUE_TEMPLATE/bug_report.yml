name: Bug report
description: Report broken behavior in action-bundle
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue — never paste secrets or tokens. For security
        reports, use the private channel in [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Expected behavior vs actual behavior
      placeholder: |
        Expected: bundleFromDir merges 8 parts
        Actual: MISSING_SHARDS error for shard 3
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, workflow YAML, or minimal repro
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: npm package version or commit SHA
      placeholder: 0.2.0-beta.1
    validations:
      required: true
  - type: input
    id: shards_tasks
    attributes:
      label: Shard count / task count
      placeholder: "8 shards, 10000 tasks"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - GitHub Actions (ubuntu-latest)
        - GitHub Actions (self-hosted)
        - Local (Linux)
        - Local (macOS)
        - Local (Windows)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Error output (sanitize secrets first)
      render: text

