name: 버그 리포트 (Bug report)
description: action-bundle의 동작 문제를 신고한다
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        공개 이슈이므로 시크릿/토큰은 절대 붙여넣지 마라. 보안 문제는
        [SECURITY.md](../../SECURITY.md)의 비공개 신고 경로를 사용한다.
  - type: textarea
    id: summary
    attributes:
      label: 무슨 일이 일어났나
      description: 기대한 동작 vs 실제 동작
      placeholder: |
        기대: bundleFromDir이 8개 part를 병합
        실제: missing shard parts 오류
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 명령어, 워크플로우 YAML, 최소 재현
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: npm 패키지 버전 또는 커밋 SHA
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 실행 환경
      options:
        - GitHub Actions (ubuntu-latest)
        - GitHub Actions (self-hosted)
        - 로컬 (Linux)
        - 로컬 (macOS)
        - 로컬 (Windows)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 관련 로그
      description: 오류 출력을 붙여넣기 (민감정보 마스킹 후)
      render: text

